services:

  backend:
    build: ./backend
    container_name: daycare-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.docker

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api/v1
        VITE_SOCKET_URL: http://localhost:5000
    container_name: daycare-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend